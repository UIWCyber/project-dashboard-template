name: Bug
description: Something that worked and now does not.
labels: ["type:bug"]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen, and what happens instead
    validations:
      required: true
  - type: markdown
    attributes:
      value: Add the layer label of the part that is broken.
